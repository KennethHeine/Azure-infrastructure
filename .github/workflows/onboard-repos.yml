name: Onboard Repositories

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:

  # Auto-trigger when any config process-repos.ps1 reconciles changes on main.
  # All three are inert declarations until this workflow applies them as the
  # onboarding SP — the only principal that can assign subscription-scope roles
  # and Graph app-roles — so a merge that isn't listed here silently does
  # nothing until someone remembers to dispatch it by hand.
  push:
    branches: [main]
    paths:
      - repos.json         # → create-repo-infrastructure.ps1
      - role-grants.json   # → apply-role-grants.ps1
      - graph-grants.json  # → apply-graph-grants.ps1
      # NOTE: providers.json (→ register-providers.ps1) has the same gap and is
      # deliberately NOT listed here — see the PR discussion; add it if wanted.

permissions:
  id-token: write   # Required for OIDC federated credential
  contents: read

jobs:
  onboard:
    name: Onboard repositories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate required secrets
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AUTOMATION_GITHUB_TOKEN: ${{ secrets.AUTOMATION_GITHUB_TOKEN }}
        run: |
          $missing = @()
          if (-not $env:AZURE_CLIENT_ID) { $missing += 'AZURE_CLIENT_ID' }
          if (-not $env:AZURE_TENANT_ID) { $missing += 'AZURE_TENANT_ID' }
          if (-not $env:AZURE_SUBSCRIPTION_ID) { $missing += 'AZURE_SUBSCRIPTION_ID' }
          if (-not $env:AUTOMATION_GITHUB_TOKEN) { $missing += 'AUTOMATION_GITHUB_TOKEN' }
          if ($missing.Count -gt 0) {
            Write-Host "::error::Missing required secrets: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All required secrets are configured" -ForegroundColor Green

      - name: Validate automation token
        shell: pwsh
        env:
          AUTOMATION_GITHUB_TOKEN: ${{ secrets.AUTOMATION_GITHUB_TOKEN }}
        run: ./scripts/test-automation-token.ps1
        # Fails the run early with a clear ::error:: if AUTOMATION_GITHUB_TOKEN
        # is expired, revoked, or under-scoped — instead of a cryptic
        # "Failed to create repository" later in Step 6. Rotate the token with
        # scripts/rotate-automation-token.ps1.

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run onboarding for all repos
        shell: pwsh
        env:
          AUTOMATION_GITHUB_TOKEN: ${{ secrets.AUTOMATION_GITHUB_TOKEN }}
        run: ./scripts/process-repos.ps1 -ConfigFile ./repos.json
